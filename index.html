<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>DoamX HR</title><style>body{font-family:Arial;background:#0B1120;color:#fff;padding:20px;margin:0}.login{max-width:400px;margin:100px auto;background:#151E32;padding:30px;border-radius:12px}input{width:100%;padding:12px;margin:10px 0;background:#0B1120;border:1px solid #2A3658;color:#fff;border-radius:8px;box-sizing:border-box}button{width:100%;padding:12px;background:#F2A93B;color:#000;border:none;border-radius:8px;font-weight:bold;cursor:pointer}#app{display:none}.header{background:#151E32;padding:15px;margin-bottom:20px;border-radius:8px;display:flex;justify-content:space-between}.card{background:#151E32;padding:20px;margin-bottom:15px;border-radius:8px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#0B1120;padding:15px;border-radius:8px;text-align:center}.stat h2{color:#F2A93B;font-size:28px;margin:5px 0}table{width:100%;margin-top:10px}td,th{padding:10px;border-bottom:1px solid #2A3658;text-align:right}.btn{padding:8px 12px;width:auto;margin:5px}.green{background:#10B981}.red{background:#EF4444}</style></head><body><div id="login" class="login">  <h1 style="text-align:center;color:#F2A93B">DoamX HR</h1>  <input id="num" placeholder="الرقم" value="1001">  <input id="pass" type="password" placeholder="الباسورد" value="demo123">  <button onclick="login()">دخول</button></div><div id="app">  <div class="header">    <h3>مرحباً <span id="uname"></span></h3>    <button class="btn red" onclick="location.reload()">خروج</button>  </div>  <div class="card">    <div class="grid">      <div class="stat"><small>الموظفين</small><h2 id="t1">5</h2></div>      <div class="stat"><small>حاضر</small><h2 id="t2" style="color:#10B981">0</h2></div>      <div class="stat"><small>غائب</small><h2 id="t3" style="color:#EF4444">5</h2></div>      <div class="stat"><small>إجازة</small><h2 id="t4" style="color:#F59E0B">0</h2></div>    </div>  </div>  <div class="card">    <h3>الموظفين</h3>    <table id="tbl"></table>  </div></div><script>const D={e:[{n:'1001',m:'المدير',r:'admin'},{n:'2728',m:'ياسر',r:'emp'},{n:'2729',m:'Rajesh',r:'emp'}],a:[]};function login(){  const n=document.getElementById('num').value;  const e=D.e.find(x=>x.n===n);  if(!e){alert('خطأ');return;}  document.getElementById('login').style.display='none';  document.getElementById('app').style.display='block';  document.getElementById('uname').textContent=e.m;  document.getElementById('tbl').innerHTML=D.e.map(x=>`<tr><td>${x.m}</td><td>${x.n}</td><td><button class="btn green" onclick="att('${x.n}')">حضور</button></td></tr>`).join('');}function att(n){  const t=new Date().toLocaleTimeString('ar-KW',{hour:'2-digit',minute:'2-digit'});  D.a.push({n:n,t:t});  document.getElementById('t2').textContent=D.a.length;  document.getElementById('t3').textContent=5-D.a.length;  alert('تم تسجيل '+n+' الساعة '+t);}</script></body></html>
