<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>DoamX HR</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Tahoma,Arial,sans-serif;background:#0B1120;color:#F5F3EC;font-size:14px}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.login-box{background:#151E32;padding:30px;border-radius:12px;border:1px solid #2A3658;width:100%;max-width:400px}input,select{width:100%;padding:12px;margin-bottom:10px;background:#0B1120;border:1px solid #2A3658;border-radius:8px;color:#F5F3EC;font-size:14px}button{width:100%;padding:12px;background:#F2A93B;color:#1A1306;border:none;border-radius:8px;font-weight:bold;cursor:pointer;font-size:14px}.btn-sm{padding:8px 12px;width:auto;font-size:12px}.btn-red{background:#EF4444;color:#fff}.btn-green{background:#10B981;color:#fff}.hidden{display:none!important}.header{background:#151E32;padding:15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2A3658}.container{padding:20px;max-width:1200px;margin:0 auto}.card{background:#151E32;padding:20px;border-radius:12px;margin-bottom:15px;border:1px solid #2A3658}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.stat{background:#0B1120;padding:15px;border-radius:8px;text-align:center}.stat h2{font-size:28px;color:#F2A93B;margin:5px 0}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;text-align:right;border-bottom:1px solid #2A3658}.badge{padding:3px 8px;border-radius:6px;font-size:11px}.green{background:rgba(16,185,129,.2);color:#10B981}.red{background:rgba(239,68,68,.2);color:#EF4444}.yellow{background:rgba(245,158,11,.2);color:#F59E0B}.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:100}.modal.show{display:flex}.modal-box{background:#151E32;padding:20px;border-radius:12px;max-width:500px;width:90%;max-height:90vh;overflow-y:auto}</style></head><body><div id="login" class="login">  <div class="login-box">    <h1 style="text-align:center;color:#F2A93B;margin-bottom:10px">DoamX HR</h1>    <p style="text-align:center;color:#8A92AC;margin-bottom:20px;font-size:12px">نظام حقيقي شغال</p>    <input id="num" placeholder="الرقم الوظيفي" value="1001">    <input id="pass" type="password" placeholder="كلمة المرور" value="demo123">    <button onclick="login()">دخول</button>    <p id="err" style="color:#EF4444;text-align:center;margin-top:10px;font-size:12px"></p>  </div></div><div id="app" class="hidden">  <div class="header">    <h3>لوحة التحكم - <span id="uname"></span></h3>    <button class="btn-sm btn-red" onclick="logout()">خروج</button>  </div>  <div class="container">    <div class="card">      <h3 style="margin-bottom:15px">الإحصائيات</h3>      <div class="grid">        <div class="stat"><small>إجمالي الموظفين</small><h2 id="total">0</h2></div>        <div class="stat"><small>حاضر اليوم</small><h2 id="present" style="color:#10B981">0</h2></div>        <div class="stat"><small>غائب</small><h2 id="absent" style="color:#EF4444">0</h2></div>        <div class="stat"><small>في إجازة</small><h2 id="leave" style="color:#F59E0B">0</h2></div>      </div>    </div>    <div id="adminPanel" class="hidden">      <div class="card">        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px">          <h3>الموظفين</h3>          <button class="btn-sm" style="background:#F2A93B;color:#1A1306;border:none;border-radius:6px;cursor:pointer" onclick="openModal()">+ إضافة موظف</button>        </div>        <table>          <thead><tr><th>الاسم</th><th>الرقم</th><th>المشروع</th><th>حذف</th></tr></thead>          <tbody id="empTable"></tbody>        </table>      </div>      <div class="card">        <h3 style="margin-bottom:15px">طلبات الإجازة - موافقة/رفض</h3>        <table>          <thead><tr><th>الموظف</th><th>النوع</th><th>من</th><th>إلى</th><th>الحالة</th><th>إجراء</th></tr></thead>          <tbody id="leaveTable"></tbody>        </table>      </div>    </div>    <div id="empPanel" class="hidden">      <div class="card">        <h3 style="margin-bottom:15px">خدماتي</h3>        <div class="grid">          <button class="btn" style="background:#10B981" onclick="checkIn()">📍 تسجيل حضور</button>          <button class="btn" onclick="openLeaveModal()">🌴 طلب إجازة</button>        </div>        <div id="myAttendance" style="margin-top:15px"></div>      </div>    </div>  </div></div><div id="empModal" class="modal">  <div class="modal-box">    <h3 style="margin-bottom:15px">إضافة موظف</h3>    <input id="eName" placeholder="الاسم">    <input id="eNum" placeholder="الرقم الوظيفي">    <select id="eProj">      <option value="1">مشروع المطلاع</option>      <option value="2">مشروع الأحمدي</option>      <option value="3">الإدارة</option>    </select>    <button onclick="saveEmp()" style="margin-top:10px">حفظ</button>    <button onclick="closeModal()" style="margin-top:5px;background:#EF4444">إلغاء</button>  </div></div><div id="leaveModal" class="modal">  <div class="modal-box">    <h3 style="margin-bottom:15px">طلب إجازة</h3>    <select id="lType">      <option>سنوية</option>      <option>مرضية</option>      <option>طارئة</option>    </select>    <input id="lFrom" type="date">    <input id="lTo" type="date">    <button onclick="submitLeave()" style="margin-top:10px">إرسال</button>    <button onclick="closeLeaveModal()" style="margin-top:5px;background:#EF4444">إلغاء</button>  </div></div><script>const DB={employees:[{id:1,num:'1001',name:'المدير العام',role:'admin',proj:3},{id:2,num:'2728',name:'ياسر عليان',role:'emp',proj:3},{id:3,num:'2729',name:'Rajesh',role:'emp',proj:1}],attendance:[],leaves:[],projects:[{id:1,name:'مشروع المطلاع'},{id:2,name:'مشروع الأحمدي'},{id:3,name:'الإدارة'}]};function login(){  const n=document.getElementById('num').value;  const emp=DB.employees.find(x=>x.num===n);  if(!emp){document.getElementById('err').textContent='رقم غير موجود';return;}  window.CUR=emp;  document.getElementById('login').classList.add('hidden');  document.getElementById('app').classList.remove('hidden');  document.getElementById('uname').textContent=emp.name;  if(emp.role==='admin'){document.getElementById('adminPanel').classList.remove('hidden');renderAdmin();}  else{document.getElementById('empPanel').classList.remove('hidden');renderEmp();}  updateStats();}function logout(){location.reload();}function updateStats(){  const today=new Date().toISOString().split('T')[0];  const total=DB.employees.length;  const present=DB.attendance.filter(a=>a.date===today&&a.in).length;  const onLeave=DB.leaves.filter(l=>l.status==='approved'&&l.from<=today&&l.to>=today).length;  document.getElementById('total').textContent=total;  document.getElementById('present').textContent=present;  document.getElementById('absent').textContent=total-present-onLeave;  document.getElementById('leave').textContent=onLeave;}function renderAdmin(){  document.getElementById('empTable').innerHTML=DB.employees.map(e=>`<tr><td>${e.name}</td><td>${e.num}</td><td>${DB.projects.find(p=>p.id===e.proj)?.name||'-'}</td><td><button class="btn-sm btn-red" onclick="delEmp(${e.id})">حذف</button></td></tr>`).join('');  document.getElementById('leaveTable').innerHTML=DB.leaves.map(l=>{    const e=DB.employees.find(x=>x.id===l.empId);    return `<tr><td>${e?e.name:'-'}</td><td>${l.type}</td><td>${l.from}</td><td>${l.to}</td><td><span class="badge ${l.status==='pending'?'yellow':'green'}">${l.status}</span></td><td>${l.status==='pending'?`<button class="btn-sm btn-green" onclick="approveLeave(${l.id},'approved')">✓</button> <button class="btn-sm btn-red" onclick="approveLeave(${l.id},'rejected')">✕</button>`:'-'}</td></tr>`;  }).join('');}function renderEmp(){  const today=new Date().toISOString().split('T')[0];  const rec=DB.attendance.find(a=>a.empId===window.CUR.id&&a.date===today);  document.getElementById('myAttendance').innerHTML=rec&&rec.in?`<div class="card" style="background:#0B1120"><p>✓ حضور اليوم: ${rec.in}</p></div>`:'<p style="color:#8A92AC">لم تسجل حضور اليوم</p>';}function openModal(){document.getElementById('empModal').classList.add('show');}function closeModal(){document.getElementById('empModal').classList.remove('show');}function saveEmp(){  const name=document.getElementById('eName').value,num=document.getElementById('eNum').value;  if(!name||!num){alert('اكمل البيانات');return;}  DB.employees.push({id:Date.now(),num,name,role:'emp',proj:parseInt(document.getElementById('eProj').value)});  closeModal();renderAdmin();updateStats();}function delEmp(id){if(confirm('حذف؟')){DB.employees=DB.employees.filter(x=>x.id!==id);renderAdmin();updateStats();}}function approveLeave(id,s){
