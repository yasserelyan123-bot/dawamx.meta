<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>DoamX HR - Working</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial,sans-serif;background:#0B1120;color:#F5F3EC;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.login{max-width:400px;width:100%;background:#151E32;padding:30px;border-radius:16px;border:1px solid #2A3658}h1{text-align:center;margin-bottom:20px;color:#F2A93B}input{width:100%;padding:12px;margin-bottom:10px;background:#0B1120;border:1px solid #2A3658;border-radius:8px;color:#F5F3EC}button{width:100%;padding:12px;background:#F2A93B;color:#1A1306;border:none;border-radius:8px;font-weight:bold;cursor:pointer}#app{display:none;max-width:1200px;width:100%}.header{background:#151E32;padding:15px;border-radius:12px;margin-bottom:15px;display:flex;justify-content:space-between;align-items:center}.card{background:#151E32;padding:20px;border-radius:12px;margin-bottom:15px;border:1px solid #2A3658}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:10px}.stat{background:#0B1120;padding:15px;border-radius:8px}.stat h2{font-size:24px;color:#F2A93B}.err{color:#EF4444;text-align:center;margin-top:10px;font-size:12px}.hidden{display:none!important}</style></head><body><div id="login" class="login">  <h1>DoamX<span style="color:#F2A93B">HR</span></h1>  <p style="text-align:center;color:#8A92AC;margin-bottom:20px;font-size:12px">نظام إدارة الموارد البشرية</p>  <input id="c" placeholder="Company Code" value="DEMO">  <input id="n" placeholder="Employee No" value="1001">  <input id="p" type="password" placeholder="Password" value="demo123">  <button onclick="login()">دخول</button>  <p id="err" class="err"></p></div><div id="app">  <div class="header">    <h2>لوحة التحكم</h2>    <button onclick="logout()" style="width:auto;padding:8px 15px;background:#EF4444;color:#fff;border:none;border-radius:6px;cursor:pointer">خروج</button>  </div>  <div class="card">    <h3>مرحباً <span id="uname"></span></h3>    <div class="grid">      <div class="stat"><small>إجمالي الموظفين</small><h2>5</h2></div>      <div class="stat"><small>حضور اليوم</small><h2>3</h2></div>      <div class="stat"><small>غائب</small><h2>2</h2></div>      <div class="stat"><small>في السكن</small><h2>4</h2></div>    </div>  <div class="card">    <h3>الموظفين</h3>    <div id="empList" style="margin-top:10px"></div>  </div></div><script>const DB={emps:[{id:1,num:'1001',name:'المدير العام',role:'admin'},{id:2,num:'2728',name:'ياسر عليان',role:'emp'},{id:3,num:'2729',name:'Rajesh',role:'emp'}]};function login(){const n=document.getElementById('n').value.trim();const emp=DB.emps.find(x=>x.num===n);if(!emp){document.getElementById('err').textContent='رقم غير موجود';return;}document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('uname').textContent=emp.name;document.getElementById('empList').innerHTML=DB.emps.map(e=>`<div style="padding:10px;background:#0B1120;margin-bottom:5px;border-radius:6px;display:flex;justify-content:space-between"><span>${e.name}</span><span>${e.num}</span></div>`).join('');}function logout(){location.reload();}</script></body></html>
